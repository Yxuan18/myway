<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="100%" role="img" aria-labelledby="svgTitle svgDesc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title id="svgTitle">额度卡和月卡，走的是两条不同的路</title>
  <desc id="svgDesc">额度卡走 AWS 号池，账号用亚马逊云开通，能力满血、稳定、可多开；月卡走 IDE 号池，额度来自各种 AI 编程编辑器，便宜但高峰期会排队变慢。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景卡片 -->
  <rect x="8" y="8" width="1184" height="964" rx="28" fill="#ffffff" stroke="#e6e9f0" stroke-width="2"/>

  <!-- 标题 -->
  <text x="600" y="64" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">额度卡和月卡，走的是两条不同的路</text>
  <text x="600" y="100" text-anchor="middle" font-size="18" fill="#475569">你买的卡不一样，背后替你干活的账号也不一样</text>
  <text x="600" y="128" text-anchor="middle" font-size="15" fill="#64748b">「号池」就是很多个账号放在一起，谁来用就分给谁</text>

  <!-- 你 -->
  <rect x="547" y="148" width="106" height="46" rx="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="177" text-anchor="middle" font-size="19" font-weight="600" fill="#334155">你</text>
  <line x1="600" y1="194" x2="600" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 中转站 -->
  <g filter="url(#soft)">
    <rect x="452" y="218" width="296" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="244" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937">中转站</text>
    <text x="600" y="266" text-anchor="middle" font-size="14" fill="#64748b">它不生产 Claude，只是帮你转接</text>
  </g>

  <!-- 分叉 -->
  <path d="M600,278 V296 H330 V314" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,278 V296 H870 V314" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 额度卡 -->
  <rect x="90" y="318" width="480" height="132" rx="18" fill="#eef4ff" stroke="#c7d7fe" stroke-width="2"/>
  <text x="122" y="360" font-size="27" font-weight="700" fill="#1d4ed8">额度卡</text>
  <text x="122" y="392" font-size="17" fill="#334155">按用量买：用多少，扣多少</text>
  <text x="122" y="420" font-size="15.5" fill="#1e40af">例：100 美元额度 ≈ 30 元</text>

  <!-- 月卡 -->
  <rect x="630" y="318" width="480" height="132" rx="18" fill="#fff7ec" stroke="#ffd9a3" stroke-width="2"/>
  <text x="662" y="360" font-size="27" font-weight="700" fill="#b45309">月卡</text>
  <text x="662" y="392" font-size="17" fill="#334155">按月买：先付一个月的钱</text>
  <text x="662" y="420" font-size="15.5" fill="#92400e">例：1 个窗口 159 元 / 月</text>

  <!-- 箭头 -->
  <line x1="330" y1="450" x2="330" y2="488" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="450" x2="870" y2="488" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AWS 号池 -->
  <rect x="90" y="492" width="480" height="250" rx="20" fill="#f8faff" stroke="#dbe6ff" stroke-width="2"/>
  <text x="122" y="538" font-size="25" font-weight="700" fill="#1d4ed8">AWS 号池</text>
  <g font-size="14.5" fill="#1d4ed8">
    <rect x="122" y="552" width="72" height="30" rx="15" fill="#e0ecff"/>
    <text x="158" y="572" text-anchor="middle">满血</text>
    <rect x="202" y="552" width="72" height="30" rx="15" fill="#e0ecff"/>
    <text x="238" y="572" text-anchor="middle">稳定</text>
    <rect x="282" y="552" width="96" height="30" rx="15" fill="#e0ecff"/>
    <text x="330" y="572" text-anchor="middle">可多开</text>
  </g>
  <g font-size="17" fill="#334155">
    <text x="122" y="626">用亚马逊云（AWS）开通的 Claude 账号。</text>
    <text x="122" y="654">账号能力是「满血」的：回答质量高，</text>
    <text x="122" y="682">还能同时开多个窗口一起用。</text>
  </g>
  <rect x="106" y="690" width="448" height="44" rx="12" fill="#e8f0fe"/>
  <text x="122" y="718" font-size="15.5" fill="#1e3a8a">像食堂正餐窗口：贵一点，但每份都是标准分量。</text>

  <!-- IDE 号池 -->
  <rect x="630" y="492" width="480" height="250" rx="20" fill="#fffaf3" stroke="#ffe7c4" stroke-width="2"/>
  <text x="662" y="538" font-size="25" font-weight="700" fill="#b45309">IDE 号池</text>
  <g font-size="14.5" fill="#b45309">
    <rect x="662" y="552" width="72" height="30" rx="15" fill="#ffedd5"/>
    <text x="698" y="572" text-anchor="middle">便宜</text>
    <rect x="742" y="552" width="88" height="30" rx="15" fill="#ffedd5"/>
    <text x="786" y="572" text-anchor="middle">会排队</text>
    <rect x="838" y="552" width="104" height="30" rx="15" fill="#ffedd5"/>
    <text x="890" y="572" text-anchor="middle">偶尔变笨</text>
  </g>
  <g font-size="17" fill="#334155">
    <text x="662" y="626">从各种 AI 编程编辑器（Cursor、Kiro 等）</text>
    <text x="662" y="654">的账号里转出来的额度，价格便宜；</text>
    <text x="662" y="682">但高峰期要排队，回答可能变慢、变笨。</text>
  </g>
  <rect x="646" y="690" width="448" height="44" rx="12" fill="#fff1dd"/>
  <text x="662" y="718" font-size="15.5" fill="#92400e">像全班拼单：便宜，但人一多就没座、菜会少一点。</text>

  <!-- 总结 -->
  <rect x="90" y="776" width="1020" height="88" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="600" y1="794" x2="600" y2="846" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">想要稳、要满血 → 额度卡</text>
  <text x="330" y="838" text-anchor="middle" font-size="14" fill="#64748b">适合每天都用、怕突然变慢</text>
  <text x="870" y="812" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">想省钱、能接受排队 → 月卡</text>
  <text x="870" y="838" text-anchor="middle" font-size="14" fill="#64748b">适合用量不大、能错峰使用</text>

  <!-- 脚注 -->
  <text x="600" y="900" text-anchor="middle" font-size="14" fill="#94a3b8">两种卡都由中转站转发，不是 Claude 官方直接卖给你的。</text>
</svg>
